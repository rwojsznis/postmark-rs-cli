# One pin per tool, read the same way locally and in CI (decision 15). Rust is
# not pinned here: mise reads `rust-toolchain.toml`, so the two cannot disagree.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
# rustsec tags each crate's releases with its own prefix, and attaches the
# prebuilt cargo-audit binaries to the `cargo-audit/v*` ones.
"github:rustsec/rustsec" = { version = "0.22.2", version_prefix = "cargo-audit/v", bin = "cargo-audit" }
"aqua:rhysd/actionlint" = "1.7.12"

# The single list of check commands. AGENTS.md and CI call these tasks and do
# not repeat the command lines.
[tasks.fmt]
run = "cargo fmt --all --check"

[tasks.clippy]
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks.doc]
env = { RUSTDOCFLAGS = "-D warnings -D rustdoc::broken_intra_doc_links" }
run = "cargo doc --locked --no-deps --document-private-items"

[tasks.machete]
run = "cargo machete"

[tasks.audit]
run = "cargo audit"

[tasks.lint]
depends = ["fmt", "clippy", "doc", "machete", "audit"]

[tasks.test]
run = "cargo test --locked --all-targets --quiet"

# CI's test matrix runs these two after `test`. An optimized build can hide or
# show a bug that a debug build does not.
[tasks.test-release]
run = "cargo test --locked --release --all-targets"

[tasks.test-doc]
run = "cargo test --locked --doc"

# The line-coverage floor: the measured coverage rounded down. It only goes
# up (AGENTS.md, Coverage).
[tasks.coverage]
run = "cargo llvm-cov --locked --all-targets --summary-only --fail-under-lines 99"

# The report CI uploads to Codecov.
[tasks.coverage-lcov]
run = "cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info --fail-under-lines 99"

[tasks.actionlint]
# Passes before task 02 adds the workflows.
run = "test ! -d .github/workflows || actionlint"

[tasks.check]
depends = ["lint", "test"]
