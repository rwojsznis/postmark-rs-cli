name: Release binaries

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: postmark-cli-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: postmark-cli-aarch64-apple-darwin.tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: postmark-cli-x86_64-unknown-linux-gnu.tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: postmark-cli-x86_64-unknown-linux-musl.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Rust only: the dev tools in mise.toml are not needed to build. No
      # cache, because a release job must not restore files that another
      # workflow wrote (see the mise-action README, "Release workflows").
      - name: Install pinned Rust
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust
          cache: false

      # mise exports RUSTUP_TOOLCHAIN, so the target goes to the pinned
      # toolchain from rust-toolchain.toml.
      - name: Add the build target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - name: Install the musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          POSTMARK_CLI_VERSION="$VERSION" cargo build --locked --release --target "${{ matrix.target }}"
          test "$("target/${{ matrix.target }}/release/postmark-cli" -V)" = "postmark-cli $VERSION"

      - name: Package binary
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.archive }} postmark-cli

      - name: Upload binary archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading archives."
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            echo "Release $TAG does not exist; creating it."
            gh release create "$TAG" dist/* --repo "$REPO" --generate-notes --verify-tag
          fi
